      not_hispanic_other_race_alone: B03002_008E
      not_hispanic_two_or_more_races: B03002_009E
      hispanic_or_latino: B03002_012E
      hispanic_white_alone: B03002_013E
      hispanic_black_alone: B03002_014E
      hispanic_american_indian_alaska_native_alone: B03002_015E
      hispanic_asian_alone: B03002_016E
